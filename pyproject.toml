[project]
name = "train-correspondances"
version = "0.1.0"
description = "GTFS-RT collector for French rail punctuality (SNCF open data, ODbL)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "gtfs-realtime-bindings>=1.0",
    "pyarrow>=17",
    "pydantic-settings>=2.4",
    "huggingface_hub>=0.25",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tc"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", "logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/tc/store/card.py" = ["E501"]  # markdown prose
